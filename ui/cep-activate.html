<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Activate eORB CEP</title>
<style>
  :root{
    --bg:#0a0d12; --card:#11161f; --line:#1f2733; --line2:#2a3442;
    --txt:#e7ecf3; --muted:#8a96a6; --accent:#818cf8; --accent2:#a5b4fc;
    --ok:#34d399; --err:#ff8a8a; --errbg:#2a1416;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:
      radial-gradient(1100px 600px at 50% -10%, #141b27 0%, transparent 60%),
      var(--bg);
    color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    display:flex; align-items:center; justify-content:center;
    -webkit-user-select:none; user-select:none;
  }
  .card{
    width:min(440px,92vw);
    background:linear-gradient(180deg,#121823, #0e131c);
    border:1px solid var(--line);
    border-radius:16px;
    padding:34px 32px 30px;
    box-shadow:0 24px 60px -20px rgba(0,0,0,.7), 0 0 0 1px rgba(129,140,248,.04) inset;
  }
  .badge{
    display:inline-flex; align-items:center; gap:7px;
    font-size:11px; letter-spacing:.12em; text-transform:uppercase;
    color:var(--accent2); font-weight:700;
    border:1px solid var(--line2); border-radius:999px;
    padding:5px 11px; margin-bottom:18px;
  }
  .dot{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--accent)}
  h1{font-size:21px; font-weight:700; letter-spacing:-.02em; margin-bottom:8px}
  p.sub{font-size:13.5px; line-height:1.6; color:var(--muted); margin-bottom:22px}
  label{display:block; font-size:11.5px; font-weight:600; letter-spacing:.04em; color:var(--muted); text-transform:uppercase; margin-bottom:8px}
  input{
    width:100%; height:46px; padding:0 14px;
    background:#0b0f16; color:var(--txt);
    border:1px solid var(--line2); border-radius:10px;
    font-size:15px; outline:none; transition:border-color .15s ease, box-shadow .15s ease;
    -webkit-user-select:text; user-select:text;
  }
  input:focus{border-color:var(--accent); box-shadow:0 0 0 3px rgba(129,140,248,.18)}
  input.bad{border-color:var(--err); box-shadow:0 0 0 3px rgba(255,138,138,.15)}
  button{
    width:100%; height:48px; margin-top:18px;
    background:linear-gradient(180deg,#6d7cf0,#5765e0);
    color:#fff; font-size:15px; font-weight:700; letter-spacing:.01em;
    border:0; border-radius:10px; cursor:pointer;
    display:flex; align-items:center; justify-content:center; gap:10px;
    transition:filter .15s ease, transform .05s ease;
  }
  button:hover{filter:brightness(1.07)}
  button:active{transform:translateY(1px)}
  button:disabled{filter:grayscale(.4) brightness(.8); cursor:default}
  .spin{width:16px;height:16px;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite;display:none}
  @keyframes sp{to{transform:rotate(360deg)}}
  .msg{margin-top:16px; font-size:13px; line-height:1.55; border-radius:9px; padding:11px 13px; display:none}
  .msg.err{display:block; background:var(--errbg); border:1px solid #5a2730; color:var(--err)}
  .msg.ok{display:block; background:rgba(52,211,153,.08); border:1px solid #1c5141; color:var(--ok)}
  .foot{margin-top:22px; padding-top:16px; border-top:1px solid var(--line); font-size:11.5px; line-height:1.6; color:#67727f}
  .foot a{color:var(--accent2); text-decoration:none}
  .foot a:hover{text-decoration:underline}
  .ver{position:fixed; bottom:14px; right:16px; font-size:10.5px; color:#3b4655}
</style>
</head>
<body>
  <div class="card">
    <span class="badge"><span class="dot"></span> Activation Required</span>
    <h1>Activate eORB CEP</h1>
    <p class="sub">Enter the email on your Chief Engineer Pro account. This installation will be activated and locked to this computer.</p>

    <label for="email">CEP account email</label>
    <input id="email" type="email" autocomplete="email" placeholder="you@example.com" spellcheck="false" />

    <button id="go" type="button">
      <span id="go-text">Activate</span>
      <span id="go-spin" class="spin"></span>
    </button>

    <div id="msg" class="msg"></div>

    <div class="foot">
      Need help? Message <a id="support" href="#">support</a> or sign in at chiefengineerpro.com. Your saved records are not affected by activation.
    </div>
  </div>
  <div class="ver" id="ver"></div>

<script>
(function(){
  var emailEl = document.getElementById('email');
  var btn = document.getElementById('go');
  var btnText = document.getElementById('go-text');
  var spin = document.getElementById('go-spin');
  var msg = document.getElementById('msg');
  var verEl = document.getElementById('ver');

  try {
    if (window.eORB && window.eORB.build) {
      verEl.textContent = (window.eORB.build.productName || 'eORB CEP') + ' · v' + (window.eORB.build.version || '');
    }
  } catch(_) {}

  var ERR = {
    invalid_email: 'Enter a valid email address.',
    not_member:    'No CEP account found for this email. Check the address or register at chiefengineerpro.com.',
    free_tier:     'eORB requires Accelerator tier or higher. Upgrade at chiefengineerpro.com.',
    device_limit:  'Device limit reached for this account. Message support@chiefengineerpro.com to manage your devices.',
    revoked:       'This license has been deactivated. Contact support@chiefengineerpro.com.',
    server_rejected:'Activation was declined by the server. Contact support if this continues.',
    network:       'Could not reach the activation server. Check your internet connection and try again.',
    timeout:       'The activation server timed out. Check your connection and try again.',
    wrong_flow_for_portable_build: 'This build cannot be activated here.',
    unknown:       'Activation failed. Please try again.'
  };

  function show(kind, text){ msg.className = 'msg ' + kind; msg.textContent = text; }
  function clearMsg(){ msg.className = 'msg'; msg.textContent = ''; }
  function busy(on){
    btn.disabled = on; emailEl.disabled = on;
    spin.style.display = on ? 'block' : 'none';
    btnText.textContent = on ? 'Verifying…' : 'Activate';
  }

  async function submit(){
    var email = (emailEl.value || '').trim().toLowerCase();
    clearMsg();
    if (!email || email.indexOf('@') < 1) {
      emailEl.classList.add('bad');
      show('err', ERR.invalid_email);
      return;
    }
    emailEl.classList.remove('bad');
    if (!window.eORB || !window.eORB.registerEmail) {
      show('err', 'Activation bridge unavailable. Please relaunch eORB CEP.');
      return;
    }
    busy(true);
    try {
      var res = await window.eORB.registerEmail(email);
      if (res && res.ok) {
        show('ok', 'Activated. Opening eORB…');
        // main reloads index.html on success; keep the screen calm meanwhile.
      } else {
        var key = (res && res.error) || 'unknown';
        show('err', ERR[key] || ERR.unknown);
        busy(false);
      }
    } catch(e) {
      show('err', ERR.network);
      busy(false);
    }
  }

  btn.addEventListener('click', submit);
  emailEl.addEventListener('keydown', function(e){ if (e.key === 'Enter') submit(); });
  document.getElementById('support').addEventListener('click', function(e){
    e.preventDefault();
    try { if (window.eORB && window.eORB.updates && window.eORB.updates.openUrl) window.eORB.updates.openUrl('https://m.me/chiefengineerpro'); } catch(_){}
  });
  emailEl.focus();
})();
</script>
</body>
</html>
